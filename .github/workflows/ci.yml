name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (tests)
        run: npm run typecheck:test
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Package dry-run
        run: npm pack --dry-run
      - name: Pack
        run: npm pack
      - name: Package smoke test
        run: node scripts/smoke-test-package.cjs

  smoke-test:
    name: Real-binary smoke tests
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Install aider (verified adapter)
        run: npm install -g aider
      - name: Install goose (verified adapter, best-effort)
        run: |
          curl -fsSL https://github.com/block/goose/releases/latest/download/goose-linux-x64 -o /usr/local/bin/goose || \
          npm install -g goose || true
          chmod +x /usr/local/bin/goose 2>/dev/null || true
      - name: Verify adapters on PATH
        run: |
          aider --version 2>/dev/null || true
          goose --version 2>/dev/null || true
      - name: Run smoke tests
        env:
          AIR_SMOKE_TEST: "1"
        run: npm test
