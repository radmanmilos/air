name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (tests)
        run: npm run typecheck:test
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Package dry-run
        run: npm pack --dry-run
      - name: Pack
        run: npm pack
      - name: Package smoke test
        run: node -e '
          const fs = require("fs");
          const cp = require("child_process");
          const os = require("os");
          const path = require("path");
          const tgz = fs.readdirSync(".").find((f) => /^air-.*\.tgz$/.test(f));
          if (!tgz) throw new Error("no tarball");
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), "air-smoke-"));
          try {
            cp.execSync(`npm install "${tgz}" --prefix "${dir}" --no-save --no-package-lock`, { stdio: "inherit" });
            const bin = path.join(dir, "node_modules", ".bin", "air");
            cp.execSync(`"${bin}" --help`, { stdio: "inherit" });
            cp.execSync(`"${bin}" --version`, { stdio: "inherit" });
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
            fs.rmSync(tgz, { force: true });
          }
        '

  smoke-test:
    name: Real-binary smoke tests
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Install aider (verified adapter)
        run: npm install -g aider
      - name: Install goose (verified adapter)
        run: |
          curl -fsSL https://github.com/block/goose/releases/latest/download/goose-linux-x64 -o /usr/local/bin/goose
          chmod +x /usr/local/bin/goose
      - name: Verify adapters on PATH
        run: |
          aider --version
          goose --version
      - name: Run smoke tests
        env:
          AIR_SMOKE_TEST: "1"
        run: npm test
