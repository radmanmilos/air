ollama:
  base_url: http://localhost:11434
  keep_alive: 5m

models:
  brain: qwen3.5:4b          # default: vision + tools + thinking
  coder: qwen2.5-coder:7b    # code specialist
  reasoner: deepseek-r1:1.5b  # fast planning/reasoning
  embed: nomic-embed-text    # embeddings

routing:
  default_context: 8192
  max_context: 32768

tools:
  shell:
    timeout_seconds: 120
  web:
    enabled: true

agent:
  max_steps: 40
  verbose: false
