[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgai"
version = "0.1.0"
description = "MGAI (Makeing Good AI) - A unified multi-model LLM system with integrated tools for autonomous agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "MGAI Creator", email = "creator@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Core dependencies (see requirements.txt)
    "requests>=2.32",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "faster-whisper>=1.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "piper-tts>=1.2",
    "duckduckgo-search>=6.2",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
mgai = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
